# Front end (static) plus the API as one Netlify Function.
[build]
  command = "node scripts/build-netlify.mjs && npm run build"
  publish = "apps/web/dist"

  [build.environment]
    NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# /api/* goes to the function (checked before the single-page-app fallback below)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single-page app: every other path serves index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
